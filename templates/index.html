<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseNews | Unified News Aggregator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full flex flex-col text-slate-800">
  <!-- Header -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center space-x-3">
          <span class="p-2 bg-indigo-600 rounded-lg text-white shadow-md shadow-indigo-200">
            <i class="fa-solid fa-satellite-dish text-lg"></i>
          </span>
          <h1 class="text-xl font-bold tracking-tight text-slate-900">Pulse<span class="text-indigo-600">News</span></h1>
        </div>

        <!-- Search Bar -->
        <div class="flex-1 max-w-md mx-6">
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
              <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <input
              id="searchInput"
              type="text"
              placeholder="Search articles, topics, headlines..."
              class="w-full pl-10 pr-4 py-2 rounded-full border border-slate-300 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
            />
          </div>
        </div>

        <!-- Controls -->
        <div class="flex items-center space-x-3">
          <button
            id="refreshBtn"
            class="inline-flex items-center space-x-2 px-3 py-2 text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors"
          >
            <i id="refreshIcon" class="fa-solid fa-rotate"></i>
            <span class="hidden sm:inline">Refresh</span>
          </button>
          <button
            id="openFeedModalBtn"
            class="inline-flex items-center space-x-2 px-3 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm transition-colors"
          >
            <i class="fa-solid fa-plus"></i>
            <span class="hidden sm:inline">Add Feed</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Sub-bar: Category Tabs & Bookmark Filter -->
  <nav class="bg-white border-b border-slate-200 sticky top-16 z-20 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between overflow-x-auto py-2.5">
      <div class="flex space-x-1 sm:space-x-2" id="categoryTabs">
        <button class="tab-btn active px-3 py-1.5 rounded-full text-xs sm:text-sm font-semibold transition-all" data-category="all">
          All Stories
        </button>
        {% for cat in categories %}
        <button class="tab-btn px-3 py-1.5 rounded-full text-xs sm:text-sm font-medium text-slate-600 hover:bg-slate-100 transition-all" data-category="{{ cat }}">
          {{ cat }}
        </button>
        {% endfor %}
      </div>
      <div class="pl-4 border-l border-slate-200">
        <button
          id="bookmarkToggleBtn"
          class="px-3 py-1.5 rounded-full text-xs sm:text-sm font-medium text-slate-600 hover:bg-slate-100 flex items-center space-x-1.5 transition-all"
        >
          <i class="fa-regular fa-bookmark text-amber-500"></i>
          <span>Saved</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content Grid -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="statusMessage" class="hidden mb-6 p-4 rounded-lg text-sm"></div>
    
    <!-- Articles Grid -->
    <div id="articlesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Injected via JavaScript -->
    </div>

    <!-- Empty / Loading State -->
    <div id="emptyState" class="hidden text-center py-20">
      <div class="p-4 rounded-full bg-slate-100 inline-flex text-slate-400 mb-3">
        <i class="fa-regular fa-newspaper text-3xl"></i>
      </div>
      <h3 class="text-lg font-semibold text-slate-800">No articles found</h3>
      <p class="text-sm text-slate-500 max-w-sm mx-auto mt-1">Try adjusting your filter, keyword search, or click Refresh to fetch the latest stories.</p>
    </div>
  </main>

  <!-- Add Feed Modal -->
  <div id="feedModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm hidden">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md mx-4 p-6 overflow-hidden transform transition-all">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-slate-900">Add Custom RSS Feed</h3>
        <button id="closeFeedModalBtn" class="text-slate-400 hover:text-slate-600 text-lg">&times;</button>
      </div>
      <form id="addFeedForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Feed Name</label>
          <input id="feedName" type="text" required placeholder="e.g., Ars Technica" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">RSS/Atom URL</label>
          <input id="feedUrl" type="url" required placeholder="https://example.com/rss" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Category</label>
          <select id="feedCategory" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
            <option value="Tech">Tech</option>
            <option value="Science">Science</option>
            <option value="World">World</option>
            <option value="Business">Business</option>
            <option value="General">General</option>
          </select>
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" id="cancelModalBtn" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
          <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow">Add & Sync</button>
        </div>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
